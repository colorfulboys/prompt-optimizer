let currentScenario = null;

function initScenarios() {
  const grid = document.getElementById('scenarioGrid');
  grid.innerHTML = '';
  scenarios.forEach(s => {
    const card = document.createElement('div');
    card.className = 'scenario-card';
    card.onclick = () => showScenario(s);
    card.innerHTML = `
      <div class="scenario-emoji">${s.emoji}</div>
      <div class="scenario-title">${s.title}</div>
      <div class="scenario-desc">${s.desc}</div>
    `;
    grid.appendChild(card);
  });
}

function showScenario(s) {
  currentScenario = s;
  document.getElementById('intro').classList.add('hidden');
  document.getElementById('result').classList.remove('hidden');
  
  document.getElementById('resultEmoji').textContent = s.emoji;
  document.getElementById('resultTitle').textContent = s.title;
  
  // 4 种回复
  const container = document.getElementById('repliesContainer');
  container.innerHTML = '';
  s.replies.forEach(r => {
    const section = document.createElement('div');
    section.className = 'reply-section reply-' + r.level;
    section.innerHTML = `
      <div class="reply-level reply-level-${r.level}">${getLevelText(r.level)}</div>
      <div class="reply-text">"${r.text}"</div>
      <div class="reply-note">💡 ${r.note}</div>
    `;
    container.appendChild(section);
  });
  
  document.getElementById('scenarioAnalysis').textContent = s.analysis;
  document.getElementById('principles').textContent = s.principles;
  
  // 海报：选最佳回复
  const bestReply = s.replies[s.replies.length - 1];
  document.getElementById('posterEmoji').textContent = s.emoji;
  document.getElementById('posterTitle').textContent = s.title;
  document.getElementById('posterReply').textContent = '"' + bestReply.text + '"';
  
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function getLevelText(level) {
  return { bad: '❌ 不推荐', normal: '😐 一般', good: '✅ 不错', best: '💎 最佳' }[level];
}

function backToScenarios() {
  document.getElementById('result').classList.add('hidden');
  document.getElementById('intro').classList.remove('hidden');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function copyShareText() {
  if (!currentScenario) return;
  const bestReply = currentScenario.replies[currentScenario.replies.length - 1];
  const text = '💬 高情商回复\\n\\n场景：' + currentScenario.title + '\\n最佳回复："' + bestReply.text + '"\\n\\n👉 查看更多话术：jianhebox.cn/fun/reply.html';
  
  navigator.clipboard.writeText(text).then(() => {
    document.getElementById('copyHint').textContent = '✅ 已复制！';
    setTimeout(() => document.getElementById('copyHint').textContent = '', 3000);
  }).catch(() => {
    const textarea = document.createElement('textarea');
    textarea.value = text;
    document.body.appendChild(textarea);
    textarea.select();
    document.execCommand('copy');
    document.body.removeChild(textarea);
    document.getElementById('copyHint').textContent = '✅ 已复制！';
    setTimeout(() => document.getElementById('copyHint').textContent = '', 3000);
  });
}

function downloadPoster() {
  document.getElementById('copyHint').textContent = '💡 海报建议：使用手机截图或浏览器右键保存图片';
  setTimeout(() => document.getElementById('copyHint').textContent = '', 3000);
}

document.addEventListener('DOMContentLoaded', () => {
  initScenarios();
  const style = document.createElement('style');
  style.textContent = '.hidden { display: none !important; }';
  document.head.appendChild(style);
});
</script>
